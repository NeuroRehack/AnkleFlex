<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkleFlex</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-view="bar">
  <header>
    <h1>AnkleFlex</h1>
    <div id="status-indicator">
      <span id="status-dot" class="dot disconnected"></span>
      <span id="status-label">Connecting…</span>
    </div>
  </header>

  <nav id="nav-bar">
    <a href="#bar"      class="nav-item" id="nav-bar-view">Bar</a>
    <a href="#graph"    class="nav-item" id="nav-graph-view">Graph</a>
    <a href="#calibrate" class="nav-item" id="nav-calibrate">Calibrate</a>
  </nav>

  <main>
    <div id="toolbar">
      <div id="shared-controls">
        <button id="tare-btn" onclick="tare()">Tare / Reset</button>
        <span id="tare-feedback"></span>
        <label id="flip-label">
          <input type="checkbox" id="flip-axis" onchange="toggleAxisFlip(this.checked)">
          Flip axis
        </label>
      </div>
      <div id="graph-controls">
        <label class="threshold-toggle">
          <input type="checkbox" id="show-thresholds" checked onchange="toggleShowThresholds(this.checked)">
          Show thresholds
        </label>
        <label class="threshold-row">
          Upper threshold
          <input type="number" id="upper-threshold" min="0" max="4000" step="10" value="500" oninput="setThresholdUp(this.value)">
        </label>
        <label class="threshold-row">
          Lower threshold
          <input type="number" id="lower-threshold" min="-4000" max="0" step="10" value="-500" oninput="setThresholdDown(this.value)">
        </label>
        <span class="scale-row-label">Y Range ±</span>
        <button class="stepper-btn" onclick="stepGraphYRange(-100)">&#8722;</button>
        <input type="range" id="yrange-slider" min="100" max="3000" step="100" value="500" oninput="setGraphYRange(this.value)">
        <span id="yrange-value">500</span>
        <button class="stepper-btn" onclick="stepGraphYRange(100)">&#43;</button>
      </div>
    </div>

    <!-- ── Bar View ─────────────────────────────────────────────────── -->
    <section id="view-bar">
      <div id="chart-container">
        <div id="weight-display">
          <span id="weight-value">—</span>
          <span id="weight-unit">kg</span>
        </div>
        <canvas id="weightChart"></canvas>
      </div>
    </section>

    <!-- ── Graph View ─────────────────────────────────────────────────── -->
    <section id="view-graph">
      <div id="graph-chart-container">
        <canvas id="graphChart"></canvas>
      </div>

      <div id="threshold-counters">
        <div class="counter-badge above">
          <span class="counter-value" id="above-count">0</span>
          <span class="counter-label">Above ▲</span>
        </div>
        <div class="counter-badge below">
          <span class="counter-value" id="below-count">0</span>
          <span class="counter-label">Below ▼</span>
        </div>
      </div>

    </section>

    <!-- ── Emulation banner (shown in both views when emulation active) -->
    <div id="emulation-panel">
      <div id="emulation-summary" onclick="toggleEmulationExpand()">
        <span>⚠ Emulation mode &mdash; simulated weight: <strong id="slider-value">0.0</strong> kg</span>
        <span id="emulation-toggle">▼ expand</span>
      </div>
      <div id="emulation-slider-row">
        <input
          type="range"
          id="emulation-slider"
          min="-100" max="100" step="0.1" value="0"
          oninput="setEmulatedWeight(this.value)"
        >
      </div>
    </div>
  </main>

  <script src="/static/vendor/chart.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
