<!DOCTYPE html>
<html lang="en" data-theme="ocean">
<head>
  <link rel="icon" type="image/x-icon" href="static/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkleFlex</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-view="bar">

  <header>
    <h1>AnkleFlex</h1>
    <div class="header-right">
      <!-- ── Theme swatches ───────────────────────────────────────────── -->
      <div id="theme-switcher" title="Switch colour theme">
        <button class="swatch active" data-theme="ocean"    aria-label="Ocean theme"></button>
        <button class="swatch"        data-theme="midnight" aria-label="Midnight theme"></button>
        <button class="swatch"        data-theme="clinical" aria-label="Clinical theme"></button>
        <button class="swatch"        data-theme="teal"     aria-label="Teal theme"></button>
      </div>
      <!-- ── Sensor health (load cell) ──────────────────────────────── -->
      <div id="sensor-health" hidden>
        <span class="dot sensor-stale"></span>
        <span id="sensor-health-label">Sensor reconnecting…</span>
      </div>
      <!-- ── Connection status ──────────────────────────────────────── -->
      <div id="status-indicator">
        <span id="status-dot" class="dot disconnected"></span>
        <span id="status-label">Connecting…</span>
      </div>
    </div>
  </header>

  <nav id="nav-bar">
    <a href="#bar"   class="nav-item" id="nav-bar-view">Bar</a>
    <a href="#graph" class="nav-item" id="nav-graph-view">Graph</a>
  </nav>

  <main>
    <div id="toolbar">

      <!-- ── Shared controls (always visible) ─────────────────────── -->
      <div id="shared-controls">
        <button id="tare-btn" onclick="tare()">Tare / Reset</button>
        <span id="tare-feedback"></span>
        <label id="flip-label">
          <input type="checkbox" id="flip-axis" onchange="toggleAxisFlip(this.checked)">
          Flip axis
        </label>
      </div>

      <!-- ── Graph-only controls ────────────────────────────────────── -->
      <div id="graph-controls">

        <!-- Row 1: Thresholds -->
        <div class="ctrl-row">
          <label class="threshold-toggle">
            <input type="checkbox" id="show-thresholds" checked onchange="toggleShowThresholds(this.checked)">
            Show thresholds
          </label>
          <label class="threshold-row">
            Upper
            <input type="number" id="upper-threshold" step="1" value="30" oninput="setThresholdUp(this.value)">
          </label>
          <label class="threshold-row">
            Lower
            <input type="number" id="lower-threshold" step="1" value="-30" oninput="setThresholdDown(this.value)">
          </label>
        </div>

        <!-- Row 2: Y Range + X Window side by side -->
        <!-- No more horizontal ctrl-row for range -->


      </div><!-- #graph-controls -->
    </div><!-- #toolbar -->

    <!-- ── Bar View ─────────────────────────────────────────────────── -->
    <section id="view-bar">
      <div id="chart-container">
        <div id="weight-display">
          <span id="weight-value">—</span>
          <span id="weight-unit">kg</span>
        </div>
        <canvas id="weightChart"></canvas>
      </div>
    </section>

    <!-- ── Graph View ────────────────────────────────────────────────── -->
    <section id="view-graph">
      <div id="graph-flex">
        <div id="yrange-slider-container">
          <div class="stepper-group vertical">
            <span class="scale-row-label">Vertical Range</span>
            <button class="stepper-btn" onclick="stepGraphYRange(10)">&#43;</button>
            <input type="range" id="yrange-slider" min="10" max="90" step="1" value="45" oninput="setGraphYRange(this.value)">
            <span id="yrange-value">45</span>
            <button class="stepper-btn" onclick="stepGraphYRange(-10)">&#8722;</button>
          </div>
        </div>
        <div id="graph-chart-container">
          <canvas id="graphChart"></canvas>
        </div>
      </div>

      <!-- ── Minimap (range brush / overview+detail) ──────────────────── -->
      <div id="minimap-container">
        <canvas id="minimapCanvas"></canvas>
        <button id="minimap-live-btn" hidden aria-label="Return to live view">
          &#9660; Back to live
        </button>
      </div>

      <div id="threshold-counters">
        <div class="counter-badge sequence">
          <span class="counter-value" id="sequence-count">0</span>
          <span class="counter-label">Full Upward Sequence</span>
        </div>
      </div>
    </section>

    <!-- ── Emulation banner ──────────────────────────────────────────── -->
    <div id="emulation-panel">
      <div id="emulation-summary" onclick="toggleEmulationExpand()">
        <span>⚠ Emulation mode &mdash; simulated weight: <strong id="slider-value">0.0</strong> kg</span>
        <span id="emulation-toggle">▼ expand</span>
      </div>
      <div id="emulation-slider-row">
        <input
          type="range"
          id="emulation-slider"
          min="-100" max="100" step="0.1" value="0"
          oninput="setEmulatedWeight(this.value)"
        >
      </div>
    </div>

  </main>

  <!-- Audio for rep/timer indication -->
  <audio id="timer-audio-rep" src="static/assets/audio/rep_sound.mp3" preload="auto"></audio>

  <script src="/static/vendor/chart.min.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/drag-threshold.js"></script>
  <script src="/static/minimap.js"></script>
  <script src="/static/theme.js"></script>
</body>
</html>
