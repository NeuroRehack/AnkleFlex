[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "T20", "Q", "RUF",
  "D211",  # no-blank-line-before-class
  "D212"   # multi-line-summary-first-line
]
ignore = ["D203", "D213"]


[tool.pytest.ini_options]
addopts = "--maxfail=1 --disable-warnings -v"
testpaths = ["tests"]
pythonpath = ["Src"]
[project]
name = "ankleflex"
description = "AnkleFlex — ankle rehabilitation biofeedback device"
version = "0.2.0"
authors = [
  { name = "AnkleFlex Contributors" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=1.6.0",
]


[project.optional-dependencies]
hardware = [
  "hx711==1.1.2.3",
  "rpi-lgpio==0.6",
]
dev = [
  "pytest",
  "pytest-cov",
  "httpx",
  "mypy",
  "ruff",
  "black"
]

[project.scripts]
ankleflex = "main:main"

[tool.setuptools.packages.find]
where = ["Src"]

[tool.uv]
package = true
