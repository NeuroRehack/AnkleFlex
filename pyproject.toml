[project]
name = "ankleflex"
version = "0.1.0"
description = "AnkleFlex force-feedback visualiser"
requires-python = ">=3.10"
dependencies = [
    "dash==2.17.1",
    "pandas==2.2.2",
    "plotly>=5.0,<6",
    "tqdm==4.66.4",
]

[project.optional-dependencies]
# Raspberry Pi hardware drivers — not installable on Windows/macOS.
hardware = [
    "hx711==1.1.2.3",
    "rpi-lgpio==0.6",
]

[tool.uv]
package = false
